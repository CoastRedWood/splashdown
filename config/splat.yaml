# splat.yaml — Splashdown (SLUS_202.23)
#
# The main LOAD segment maps file 0x100 -> vram 0x200000,
# so: vaddr = file_offset + 0x1FFF00.
#
# Layout (from ELF program headers):
#   main LOAD: file 0x100 -> vram 0x200000, filesz 0x24EA00, memsz 0x2F5680
#   entry: 0x200008 (Sony crt0: BSS clear 0x44EA00-0x4F5680, then init calls)
#   BSS: vram 0x44EA00, size 0xA6C80
#
# Refined section map:
#   .text:        0x200000-0x3DFFFF  (4,337 functions; first at 0x2000B0 —
#                 the crt0 BSS-clear loop at 0x200008 wasn't auto-recognized)
#   .rodata:      0x3E0000-0x43FFFF  (zero functions; strings, vtables,
#                 TypeRegistry names)
#   .text island: 0x440000-0x445CE7  (__sinit_<File> static initializers, one per
#                 TU with globals, in link order — per the retail .symtab)
#   .data:        0x445CF0-0x44E9FF  (.p__sinit_* pointer table, then data)
#   .bss:         0x44EA00-0x4F567F
#
# Non-mwcc code: crt0 (0x200000-0x2000C0) and the libraries
# linked after the game objects (0x3A1AD8-0x3CA670: libgcc, Sony SDK
# libs stamped 2100-2140, newlib) are one asm subsegment per retail object,
# asm/sdk/<lib>/, carried verbatim and not decompiled. Game code is `text`
# (0x2000C0-) and `text_late` (0x3CA670-).

name: splashdown
sha1: 496ba6a5bfe9d7e68ea2edb993b493033ccc9bae

options:
  basename: SLUS_202.23
  target_path: baserom/SLUS_202.23
  base_path: ..
  compiler: EEGCC
  platform: ps2
  asm_path: asm
  src_path: src
  build_path: build
  asset_path: assets
  # Disassemble every function up front: progress tooling reads retail
  # bytes/sizes from the generated .s files.
  disassemble_all: True
  # Let splat refine code/data boundaries inside subsegments.
  find_file_boundaries: True
  # Do not auto-create .c files: src/tu/ has one file per retail TU.
  create_c_files: False
  # Emit subsegments in listed order: retail layout is text, rodata, text
  # island, data — splat's default section grouping would reorder them.
  ld_legacy_generation: True
  # Until TUs are split out as c segments, game code is one asm file per
  # region (text, text_late); library code is one file per object (asm/sdk).
  symbol_addrs_path:
    - config/symbol_addrs.txt

segments:
  - [0x0, bin, elf_header]       # ELF + program headers
  - name: main
    type: code
    start: 0x100
    vram: 0x200000
    bss_size: 0xA6C80
    # 8, not splat's default 16: ee-gcc objects start on 8-byte boundaries.
    subalign: 8
    subsegments:
      - [0x100, asm, sdk/crt0/crt0]                 # 0x200000-0x2000C0 _start (+3)
      - [0x1C0, asm, text]                          # 0x2000C0-0x3A1AD8 : Soultree, Jetski, PSX layer, zlib, MSL runtime (mwcc)
      # ---- Sony SDK + ee-gcc runtime, 0x3A1AD8-0x3CA670 ----
      - [0x1A1BD8, asm, sdk/libgcc/_divdi3]         # 0x3A1AD8-0x3A21C8 __divdi3
